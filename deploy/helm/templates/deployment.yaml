{{- $storageType := .Values.alternateReportStorage.type | default "filesystem" }}
{{- if and .Values.alternateReportStorage.enabled (not (has $storageType (list "filesystem" "s3"))) }}
{{- fail (printf "alternateReportStorage.type must be \"filesystem\" or \"s3\", got %q" $storageType) }}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trivy-operator.fullname" . }}
  namespace: {{ include "trivy-operator.namespace" . }}
  {{- with .Values.operator.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "trivy-operator.labels" . | nindent 4 }}
    {{- with .Values.operator.labels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.operator.replicas }}
  {{- with .Values.operator.revisionHistoryLimit }}
  revisionHistoryLimit: {{ . }}
  {{- end }}
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "trivy-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmaps/trivy-operator-config.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "trivy-operator.selectorLabels" . | nindent 8 }}
        {{- with .Values.operator.podLabels }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.hostAliases }}
      hostAliases:
        {{- toYaml .Values.hostAliases | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "trivy-operator.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      containers:
        - name: {{ .Chart.Name | quote }}
          image: "{{ include "global.imageRegistry" . | default .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- with .Values.image.pullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          env:
            - name: OPERATOR_NAMESPACE
              value: {{ include "trivy-operator.namespace" . }}
            - name: OPERATOR_TARGET_NAMESPACES
              value: {{ .Values.targetNamespaces | quote }}
            - name: OPERATOR_EXCLUDE_NAMESPACES
              value: {{ .Values.excludeNamespaces | quote }}
            - name: OPERATOR_TARGET_WORKLOADS
              value: {{ tpl .Values.targetWorkloads . | quote }}
            - name: OPERATOR_SERVICE_ACCOUNT
              value: {{ include "trivy-operator.serviceAccountName" . | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if and .Values.alternateReportStorage.enabled (eq $storageType "filesystem") }}
            - name: OPERATOR_ALTERNATE_REPORT_STORAGE_ENABLED
              value: "true"
            - name: OPERATOR_ALTERNATE_REPORT_STORAGE_DIR
              value: {{ .Values.alternateReportStorage.mountPath | quote }}
          {{- else if and .Values.alternateReportStorage.enabled (eq $storageType "s3") }}
          {{- with .Values.alternateReportStorage.s3 }}
            - name: OPERATOR_ALTERNATE_REPORT_STORAGE_ENABLED
              value: "true"
            - name: OPERATOR_ALTERNATE_REPORT_STORAGE_TYPE
              value: "s3"
            - name: OPERATOR_ALTERNATE_REPORT_STORAGE_S3_BUCKET
              value: {{ required "alternateReportStorage.s3.bucket is required when alternateReportStorage.type is s3" .bucket | quote }}
            - name: OPERATOR_ALTERNATE_REPORT_STORAGE_S3_PREFIX
              value: {{ .prefix | quote }}
            - name: OPERATOR_ALTERNATE_REPORT_STORAGE_S3_ENDPOINT
              value: {{ .endpoint | quote }}
            - name: OPERATOR_ALTERNATE_REPORT_STORAGE_S3_REGION
              value: {{ .region | quote }}
            - name: OPERATOR_ALTERNATE_REPORT_STORAGE_S3_USE_PATH_STYLE
              value: {{ .usePathStyle | quote }}
          {{- end }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: trivy-operator-config
            {{- if .Values.operator.valuesFromConfigMap }}
            - configMapRef:
                name: {{ .Values.operator.valuesFromConfigMap }}
            {{- end }}
            {{- if .Values.operator.valuesFromSecret }}
            - secretRef:
                name: {{ .Values.operator.valuesFromSecret }}
            {{- end }}
            {{- if and .Values.alternateReportStorage.enabled (eq $storageType "s3") .Values.alternateReportStorage.s3.existingSecret }}
            - secretRef:
                name: {{ .Values.alternateReportStorage.s3.existingSecret }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /readyz/
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz/
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 10
          {{- with .Values.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if and .Values.alternateReportStorage.enabled (eq $storageType "filesystem") }}
          {{- if not .Values.volumeMounts }}
          volumeMounts:
          {{- end }}
            - name: {{ .Values.alternateReportStorage.volumeName }}
              mountPath: {{ .Values.alternateReportStorage.mountPath }}
          {{- end }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or (not (empty .Values.podSecurityContext)) (and .Values.alternateReportStorage.enabled (eq $storageType "filesystem")) }}
      securityContext:
      {{- with .Values.podSecurityContext }}
        {{ toYaml . | nindent 8 }}
      {{- end }}
      # ── but only add runAsUser/fsGroup if alternateReportStorage is on ─────────
      {{- if and .Values.alternateReportStorage.enabled (eq $storageType "filesystem") }}
        runAsUser: {{ .Values.alternateReportStorage.podSecurityContext.runAsUser }}
        fsGroup:   {{ .Values.alternateReportStorage.podSecurityContext.fsGroup }}
      {{- end }}
      {{- end }}
      {{- with .Values.volumes }}
      volumes: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.alternateReportStorage.enabled (eq $storageType "filesystem") }}
      {{- if not .Values.volumes }}
      volumes:
      {{- end }}
        - name: {{ .Values.alternateReportStorage.volumeName }}
          persistentVolumeClaim:
            claimName: {{ .Values.alternateReportStorage.volumeName }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
